name: CI - build and test

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Needed so the workflow can push the reports to the gh-pages branch
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'adopt'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build and test
      run: ./gradlew build --console=plain
    - name: Generate reports
      run: ./gradlew reports --console=plain
    - name: Set git identity for publishing
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    - name: Deploy reports to website
      run: ./gradlew deployReports --console=plain
      env:
        GRGIT_USER: ${{ secrets.GITHUB_TOKEN }}
